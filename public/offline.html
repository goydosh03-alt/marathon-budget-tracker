<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05090b" />
<title>Snapcost</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #05090b; color: #eaf2f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center;
  }
  .box { padding: 32px 24px; max-width: 320px; }
  img { width: 72px; height: 72px; border-radius: 18px; opacity: .9; }
  h1 { font-size: 20px; margin: 18px 0 6px; }
  p { color: rgba(255,255,255,.55); font-size: 14px; margin: 0 0 22px; line-height: 1.5; }
  button {
    background: #4ade9f; color: #05261a; border: none; border-radius: 999px;
    padding: 12px 28px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
</style>
</head>
<body>
  <div class="box">
    <img src="/icon-192.png" alt="Snapcost" />
    <h1 id="t">Немає інтернету</h1>
    <p id="h">Перевір зʼєднання і спробуй ще раз.</p>
    <button id="b" onclick="location.reload()">Спробувати ще</button>
  </div>
  <script>
    // та сама трійка мов, що і в застосунку
    var L = {
      uk: ["Немає інтернету", "Перевір зʼєднання і спробуй ще раз.", "Спробувати ще"],
      en: ["You're offline", "Check your connection and try again.", "Try again"],
      ru: ["Нет интернета", "Проверь соединение и попробуй ещё раз.", "Попробовать ещё"]
    };
    var nav = (navigator.language || "").toLowerCase();
    var lang = nav.indexOf("uk") === 0 ? "uk" : nav.indexOf("ru") === 0 ? "ru" : "en";
    document.getElementById("t").textContent = L[lang][0];
    document.getElementById("h").textContent = L[lang][1];
    document.getElementById("b").textContent = L[lang][2];
    // автоматично перезавантажуємось, щойно зʼявиться мережа
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
